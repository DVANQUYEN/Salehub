name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run --if-present lint

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t saleshub:latest .

      - name: Verify image runs
        run: |
          docker run -d --name saleshub-test -p 3000:3000 \
            -e NODE_ENV=development \
            -e PORT=3000 \
            -e JWT_SECRET=ci-test-secret-key-that-is-at-least-32-chars \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            saleshub:latest
          sleep 10
          curl -f http://localhost:3000/health || (docker logs saleshub-test && exit 1)
          docker rm -f saleshub-test
