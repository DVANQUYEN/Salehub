version: '3.8'

services:
  app:
    build: .
    container_name: salehub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - salehub-network

  db:
    image: postgres:15-alpine
    container_name: salehub-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-salehub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-salehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salehub-network
    # KHÔNG expose port 5432 ra ngoài trong production

  nginx:
    image: nginx:alpine
    container_name: salehub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - app
    networks:
      - salehub-network

volumes:
  postgres_data:

networks:
  salehub-network:
    driver: bridge
